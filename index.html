<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIKE WEEKLY — 주간 뉴스 리포트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      color: #111;
      padding: 40px 15px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    header {
      padding: 30px 35px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 15px;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .brand-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .header-right {
      text-align: right;
    }
    .date-str {
      font-size: 13px;
      font-weight: 600;
      color: #777;
      margin-bottom: 6px;
    }
    .stock-badge {
      display: inline-block;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }
    .stock-change { font-weight: 700; margin-left: 4px; }
    .up { color: #2e7d32; }
    .down { color: #d32f2f; }
    
    .content { padding: 35px; }
    .section-title {
      font-size: 18px;
      font-weight: 800;
      border-bottom: 2px solid #111;
      padding-bottom: 8px;
      margin: 35px 0 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title:first-child { margin-top: 0; }
    .section-sub { font-size: 11px; color: #888; font-weight: 700; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .card-cat {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: #111;
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
      color: #111;
      text-decoration: none;
      margin-bottom: 8px;
    }
    .card-title:hover { text-decoration: underline; }
    .card-desc {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 12px;
      flex-grow: 1;
    }
    .card-meta { font-size: 11px; color: #888; }
    
    footer {
      background: #f9f9fb;
      border-top: 1px solid #eee;
      padding: 25px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="brand-sub">WEEKLY INTELLIGENCE REPORT</div>
        <div class="brand-title">NIKE WEEKLY</div>
      </div>
      <div class="header-right">
        <div class="date-str" id="report-date">불러오는 중...</div>
        <div class="stock-badge" id="stock-badge">NKE Loading...</div>
      </div>
    </header>

    <div class="content">
      <div class="section-title">
        <span>제품 · 브랜드</span>
        <span class="section-sub">PRODUCT / BRAND</span>
      </div>
      <div class="grid" id="product-grid"></div>

      <div class="section-title">
        <span>기업 · 경영</span>
        <span class="section-sub">CORPORATE / BUSINESS</span>
      </div>
      <div class="grid" id="business-grid"></div>
    </div>

    <footer>
      NIKE WEEKLY 주간 뉴스 리포트 &bull; 자동 갱신 웹페이지
    </footer>
  </div>

  <script>
    async function loadNews() {
      try {
        const res = await fetch('./data/news.json?v=' + new Date().getTime());
        const data = await res.json();

        // 날짜 & 주가 업데이트
        document.getElementById('report-date').innerText = data.date || '';
        if (data.stock) {
          const s = data.stock;
          const colorClass = s.is_up ? 'up' : 'down';
          document.getElementById('stock-badge').innerHTML = 
            `NKE <strong>${s.price || ''}</strong> <span class="stock-change ${colorClass}">${s.change || ''}</span>`;
        }

        const items = data.items || [];
        const productGrid = document.getElementById('product-grid');
        const businessGrid = document.getElementById('business-grid');

        productGrid.innerHTML = '';
        businessGrid.innerHTML = '';

        items.forEach(item => {
          const imgHtml = item.image ? `<img src="${item.image}" alt="news">` : '';
          const cardHtml = `
            <div class="card">
              ${imgHtml}
              <div class="card-cat">${item.cat || 'NEWS'}</div>
              <a class="card-title" href="${item.url}" target="_blank">${item.title}</a>
              <div class="card-desc">${(item.summary || '').substring(0, 100)}...</div>
              <div class="card-meta">${item.source || ''} &bull; ${item.date || ''}</div>
            </div>
          `;

          if (['PRODUCT', 'BRAND'].includes(item.cat)) {
            productGrid.innerHTML += cardHtml;
          } else {
            businessGrid.innerHTML += cardHtml;
          }
        });
      } catch (e) {
        console.error('데이터 로드 실패:', e);
      }
    }

    loadNews();
  </script>
</body>
</html>
