name: Update Nike Daily News & Send Email

on:
  schedule:
    # 매일 한국 시간 기준 오전 7시 실행 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 실행 지원

jobs:
  update-and-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 lxml requests

      - name: Fetch Latest News
        run: |
          python scripts/fetch_news.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto update news data" &&
            git pull --rebase origin main &&
            git push
          )

      - name: Send Email Newsletter
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBERS_SHEET_URL: ${{ secrets.SUBSCRIBERS_SHEET_URL }}
        run: |
          python -c "
          import os, json, smtplib, csv, urllib.request, datetime
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          sheet_url = os.environ.get('SUBSCRIBERS_SHEET_URL')
          gmail_user = os.environ.get('GMAIL_USER')
          gmail_pass = os.environ.get('GMAIL_APP_PASSWORD')

          if not sheet_url or not gmail_user or not gmail_pass:
              print('이메일 설정 정보가 부족하여 스킵합니다.')
              exit(0)

          # 1. 구독자 목록 가져오기
          subscribers = []
          try:
              req = urllib.request.urlopen(sheet_url)
              lines = [l.decode('utf-8') for l in req.readlines()]
              reader = csv.reader(lines)
              next(reader, None)
              for row in reader:
                  for col in row:
                      if '@' in col:
                          subscribers.append(col.strip())
          except Exception as e:
              print('구독자 목록 불러오기 실패:', e)

          subscribers = list(set(subscribers))
          if not subscribers:
              print('구독자가 없습니다.')
              exit(0)

          # 2. 뉴스 읽기
          with open('data/news.json', 'r', encoding='utf-8') as f:
              news_data = json.load(f)

          articles = news_data.get('items', [])
          if not articles:
              print('발송할 뉴스가 없습니다.')
              exit(0)

          today_str = datetime.date.today().strftime('%Y년 %m월 %d일')

          # 3. 고급 일간지 HTML 템플릿 생성
          html = f'''
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset=\"utf-8\">
          </head>
          <body style=\"margin: 0; padding: 20px 0; background-color: #f4f5f7; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;\">
            <div style=\"max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);\">
              
              <!-- 헤더 영역 -->
              <div style=\"background-color: #111111; color: #ffffff; padding: 30px 25px; text-align: center;\">
                <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #f35b04; text-transform: uppercase; margin-bottom: 6px;\">DAILY NEWSLETTER</div>
                <h1 style=\"margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;\">NIKE DAILY</h1>
                <div style=\"font-size: 13px; color: #aaaaaa; margin-top: 8px;\">{today_str} 나이키 산업 & 시장 동향 리포트</div>
              </div>

              <!-- 서두 요약 -->
              <div style=\"padding: 20px 25px 10px 25px; border-bottom: 1px solid #eeeeee;\">
                <p style=\"margin: 0; font-size: 14px; color: #555555; line-height: 1.6;\">
                  <b>{news_data.get('insight', '오늘의 나이키 관련 주요 뉴스 모음입니다.')}</b>
                </p>
              </div>

              <!-- 기사 리스트 -->
              <div style=\"padding: 10px 25px;\">
          '''

          cat_colors = {
              'PRODUCT': '#007aff',
              'MARKET': '#34c759',
              'BRAND': '#ff9500',
              'SPORTS': '#ff2d55',
              'BUSINESS': '#5856d6'
          }

          for item in articles[:10]:
              cat = item.get('cat', 'BUSINESS')
              badge_color = cat_colors.get(cat, '#5856d6')
              
              html += f'''
                <div style=\"padding: 20px 0; border-bottom: 1px solid #f0f0f0;\">
                  <div style=\"margin-bottom: 8px;\">
                    <span style=\"background-color: {badge_color}; color: #ffffff; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 4px;\">{cat}</span>
                    <span style=\"font-size: 12px; color: #888888; margin-left: 8px;\">{item.get('source', '')}</span>
                  </div>
                  <a href=\"{item['url']}\" style=\"text-decoration: none; font-size: 17px; font-weight: bold; color: #111111; line-height: 1.4; display: block; margin-bottom: 8px;\">
                    {item['title']}
                  </a>
                  <p style=\"margin: 0 0 12px 0; font-size: 13px; color: #666666; line-height: 1.5;\">
                    {item.get('summary', '')[:140]}...
                  </p>
                  <a href=\"{item['url']}\" style=\"display: inline-block; font-size: 12px; font-weight: bold; color: #f35b04; text-decoration: none;\">
                    기사 원문 읽기 &rarr;
                  </a>
                </div>
              '''

          html += f'''
              </div>

              <!-- 푸터 영역 -->
              <div style=\"background-color: #f9f9f9; padding: 20px 25px; text-align: center; border-top: 1px solid #eeeeee; font-size: 12px; color: #888888;\">
                <p style=\"margin: 0 0 6px 0;\">본 메일은 <b>NIKE DAILY</b> 뉴스레터 구독자에게 자동 발송됩니다.</p>
                <p style=\"margin: 0;\"><a href=\"https://a01026710821-gif.github.io/Nike-Daily/\" style=\"color: #111111; font-weight: bold; text-decoration: underline;\">웹사이트에서 보기</a></p>
              </div>

            </div>
          </body>
          </html>
          '''

          # 4. 메일 전송
          try:
              server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
              server.login(gmail_user, gmail_pass)
              for sub in subscribers:
                  msg = MIMEMultipart('alternative')
                  msg['Subject'] = f\"[NIKE DAILY] {today_str} 나이키 뉴스 일간지\"
                  msg['From'] = gmail_user
                  msg['To'] = sub
                  msg.attach(MIMEText(html, 'html'))
                  server.sendmail(gmail_user, sub, msg.as_string())
                  print('발송 완료:', sub)
              server.quit()
          except Exception as e:
              print('메일 발송 오류:', e)
          "
