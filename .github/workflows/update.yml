name: Update Nike Weekly News & Send Email

on:
  schedule:
    - cron: '50 21 * * 0' # 매주 월요일 아침 6시 50분 (KST)
  workflow_dispatch:

jobs:
  update-and-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 lxml requests

      - name: Fetch Latest News
        run: |
          python scripts/fetch_news.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto update news data" &&
            git pull --rebase origin main &&
            git push
          )

      - name: Send Email Newsletter
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBERS_SHEET_URL: ${{ secrets.SUBSCRIBERS_SHEET_URL }}
        run: |
          python -c "
          import os, json, smtplib, csv, urllib.request, datetime
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          sheet_url = os.environ.get('SUBSCRIBERS_SHEET_URL')
          gmail_user = os.environ.get('GMAIL_USER')
          gmail_pass = os.environ.get('GMAIL_APP_PASSWORD')

          if not sheet_url or not gmail_user or not gmail_pass:
              print('이메일 설정 정보가 부족하여 스킵합니다.')
              exit(0)

          subscribers = []
          try:
              req = urllib.request.urlopen(sheet_url)
              lines = [l.decode('utf-8') for l in req.readlines()]
              reader = csv.reader(lines)
              next(reader, None)
              for row in reader:
                  for col in row:
                      if '@' in col:
                          subscribers.append(col.strip())
          except Exception as e:
              print('구독자 목록 불러오기 실패:', e)

          subscribers = list(set(subscribers))
          if not subscribers:
              print('구독자가 없습니다.')
              exit(0)

          with open('data/news.json', 'r', encoding='utf-8') as f:
              news_data = json.load(f)

          articles = news_data.get('items', [])
          stock = news_data.get('stock', {})
          if not articles:
              print('발송할 뉴스가 없습니다.')
              exit(0)

          today_str = datetime.date.today().strftime('%Y년 %m월 %d일')

          # 4개 카테고리별 분리
          product_items = [a for a in articles if a.get('cat') == 'PRODUCT'][:3]
          brand_items = [a for a in articles if a.get('cat') == 'BRAND'][:3]
          sports_items = [a for a in articles if a.get('cat') == 'SPORTS'][:3]
          market_items = [a for a in articles if a.get('cat') == 'MARKET'][:3]

          def render_card(item):
              if not item: return ''
              cat = item.get('cat', 'BUSINESS')
              title = item.get('title', '')
              summary = item.get('summary', '')[:100] + '...' if len(item.get('summary', '')) > 100 else item.get('summary', '')
              source = item.get('source', '')
              date = item.get('date', '')
              url = item.get('url', '#')
              img_url = item.get('image', '')

              img_tag = ''
              if img_url:
                  img_tag = f'<div style=\"margin-bottom: 10px; max-height: 120px; overflow: hidden; border-radius: 4px;\"><img src=\"{img_url}\" style=\"width: 100%; height: auto; display: block; object-fit: cover;\" alt=\"news image\" /></div>'

              return f'''
              <div style=\"background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 14px; box-sizing: border-box; height: 100%;\">
                {img_tag}
                <div style=\"font-size: 10px; font-weight: 800; color: #111111; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px;\">{cat}</div>
                <a href=\"{url}\" style=\"text-decoration: none; color: #111111; font-size: 13px; font-weight: 800; line-height: 1.35; display: block; margin-bottom: 6px;\">{title}</a>
                <p style=\"font-size: 12px; color: #555555; line-height: 1.4; margin: 0 0 8px 0;\">{summary}</p>
                <div style=\"font-size: 10px; color: #888888;\">{source} &bull; {date}</div>
              </div>
              '''

          def render_section(title_kr, title_en, items):
              if not items: return ''
              section_html = f'''
              <div style=\"border-bottom: 2px solid #111111; padding-bottom: 4px; margin-top: 25px; margin-bottom: 12px;\">
                <table width=\"100%\">
                  <tr>
                    <td style=\"font-size: 14px; font-weight: 800; color: #111111;\">{title_kr}</td>
                    <td align=\"right\" style=\"font-size: 10px; font-weight: 700; color: #888888;\">{title_en}</td>
                  </tr>
                </table>
              </div>
              <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" style=\"margin-bottom: 15px;\">
                <tr>
              '''
              for item in items:
                  section_html += f'<td width=\"33%\" valign=\"top\" style=\"padding: 0 4px;\">{render_card(item)}</td>'
              section_html += '</tr></table>'
              return section_html

          stock_price_str = stock.get('price', '$0.00')
          stock_change_str = stock.get('change', '')
          stock_color = '#2e7d32' if stock.get('is_up', True) else '#d32f2f'

          html = f'''
          <!DOCTYPE html>
          <html>
          <head><meta charset=\"utf-8\"></head>
          <body style=\"margin: 0; padding: 20px 10px; background-color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">
            <div style=\"max-width: 680px; margin: 0 auto; background-color: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);\">
              
              <!-- 헤더 -->
              <div style=\"padding: 20px 25px; border-bottom: 1px solid #eeeeee;\">
                <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\">
                  <tr>
                    <td valign=\"top\">
                      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: #777777; text-transform: uppercase; margin-bottom: 2px;\">WEEKLY INTELLIGENCE REPORT</div>
                      <div style=\"font-size: 26px; font-weight: 900; letter-spacing: -1px; color: #111111;\">NIKE WEEKLY</div>
                    </td>
                    <td align=\"right\" valign=\"top\">
                      <div style=\"margin-bottom: 6px;\">
                        <a href=\"https://a01026710821-gif.github.io/Nike-Daily/\" style=\"font-size: 11px; font-weight: 800; color: #111111; background-color: #f0f0f2; padding: 4px 8px; border-radius: 4px; text-decoration: none; display: inline-block;\">웹에서 보기 ↗</a>
                      </div>
                      <div style=\"font-size: 11px; font-weight: 700; color: #111111;\">NKE {stock_price_str} <span style=\"color:{stock_color};\">{stock_change_str}</span></div>
                      <div style=\"font-size: 10px; color: #888888; margin-top: 2px;\">{today_str}</div>
                    </td>
                  </tr>
                </table>
              </div>

              <!-- 4개 섹션 출력 -->
              <div style=\"padding: 10px 20px 20px 20px;\">
                {render_section('제품 · 컬렉션', 'PRODUCT', product_items)}
                {render_section('브랜드 · 마케팅', 'BRAND', brand_items)}
                {render_section('스포츠 · 선수', 'SPORTS', sports_items)}
                {render_section('증시 · 기업경영', 'MARKET', market_items)}
              </div>

              <!-- 푸터 -->
              <div style=\"background-color: #f9f9fb; border-top: 1px solid #eeeeee; padding: 15px 20px; text-align: center; font-size: 11px; color: #777777;\">
                <p style=\"margin: 0 0 6px 0; font-weight: 600;\">본 메일은 NIKE WEEKLY 주간 뉴스레터 구독자에게 발송됩니다.</p>
                <p style=\"margin: 0;\">
                  <a href=\"https://a01026710821-gif.github.io/Nike-Daily/\" style=\"color: #111111; font-weight: bold; text-decoration: underline;\">웹사이트에서 보기</a>
                </p>
              </div>

            </div>
          </body>
          </html>
          '''

          try:
              server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
              server.login(gmail_user, gmail_pass)
              for sub in subscribers:
                  msg = MIMEMultipart('alternative')
                  msg['Subject'] = f\"[NIKE WEEKLY] 주간 나이키 뉴스 리포트 ({today_str})\"
                  msg['From'] = gmail_user
                  msg['To'] = sub
                  msg.attach(MIMEText(html, 'html'))
                  server.sendmail(gmail_user, sub, msg.as_string())
                  print('발송 완료:', sub)
              server.quit()
          except Exception as e:
              print('메일 발송 오류:', e)
          "
