name: Update Nike Weekly News & Send Email

on:
  schedule:
    - cron: '50 21 * * 0' # 매주 월요일 아침 6시 50분 (KST) 자동 실행
  workflow_dispatch:
    inputs:
      send_email:
        description: '이메일 수신자에게 메일을 함께 발송할까요?'
        required: true
        type: boolean
        default: false

jobs:
  update-and-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 lxml requests

      - name: Fetch Latest News
        run: |
          python scripts/fetch_news.py

      - name: Generate Executive Brief (AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_executive_brief.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto update news data" &&
            git pull --rebase origin main &&
            git push
          )

      - name: Send Email Newsletter
        if: ${{ github.event_name == 'schedule' || inputs.send_email == true }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBERS_SHEET_URL: ${{ secrets.SUBSCRIBERS_SHEET_URL }}
        run: |
          python -c "
          import os, json, smtplib, csv, urllib.request, datetime, html as html_lib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          sheet_url = os.environ.get('SUBSCRIBERS_SHEET_URL')
          gmail_user = os.environ.get('GMAIL_USER')
          gmail_pass = os.environ.get('GMAIL_APP_PASSWORD')

          if not sheet_url or not gmail_user or not gmail_pass:
              print('이메일 설정 정보가 부족하여 스킵합니다.')
              exit(0)

          subscribers = []
          try:
              req = urllib.request.urlopen(sheet_url)
              lines = [l.decode('utf-8') for l in req.readlines()]
              reader = csv.reader(lines)
              next(reader, None)
              for row in reader:
                  for col in row:
                      if '@' in col:
                          subscribers.append(col.strip())
          except Exception as e:
              print('구독자 목록 불러오기 실패:', e)

          subscribers = list(set(subscribers))
          if not subscribers:
              print('구독자가 없습니다.')
              exit(0)

          with open('data/news.json', 'r', encoding='utf-8') as f:
              news_data = json.load(f)

          articles = news_data.get('items', [])
          stock = news_data.get('stock', {})
          summaries = news_data.get('summaries', {})
          from pathlib import Path
          brief_html = Path('data/executive_brief_email.html').read_text(encoding='utf-8') if Path('data/executive_brief_email.html').exists() else ''
          ai_notice = '<div style=\"padding:12px 16px;background:#f5f5f5;border-left:3px solid #ea580c;margin:14px 0 18px;font-size:13px;line-height:1.7;color:#555555;\">본 보고서는 전주 주요 Nike 관련 기사의 제목과 요약을 바탕으로 AI가 작성한 경영전략 분석 자료입니다.</div>' if brief_html else ''
          if not articles:
              print('발송할 뉴스가 없습니다.')
              exit(0)

          today_str = datetime.date.today().strftime('%Y년 %m월 %d일')

          product_items = [a for a in articles if a.get('cat') == 'PRODUCT'][:3]
          brand_items = [a for a in articles if a.get('cat') == 'BRAND'][:3]
          sports_items = [a for a in articles if a.get('cat') == 'SPORTS'][:3]
          market_items = [a for a in articles if a.get('cat') == 'MARKET'][:3]
          competitor_items = [a for a in articles if a.get('cat') == 'COMPETITOR'][:3]

          def render_card(item):
              if not item: return ''
              cat = item.get('cat', 'BUSINESS')
              title = html_lib.escape(str(item.get('title', '')))
              raw_summary = str(item.get('summary', ''))
              summary = html_lib.escape(raw_summary[:190] + ('...' if len(raw_summary) > 190 else ''))
              source = html_lib.escape(str(item.get('source', '')))
              date = html_lib.escape(str(item.get('date', '')))
              url = html_lib.escape(str(item.get('url', '#')) if str(item.get('url', '')).startswith(('https://','http://')) else '#', quote=True)
              img_url = html_lib.escape(str(item.get('image', '')), quote=True) if str(item.get('image', '')).startswith(('https://','http://')) else ''

              img_tag = ''
              if img_url:
                  img_tag = f'<div style=\"margin-bottom: 10px; max-height: 120px; overflow: hidden; border-radius: 4px;\"><img src=\"{img_url}\" style=\"width: 100%; height: auto; display: block; object-fit: cover;\" alt=\"news image\" /></div>'

              return f'''
              <div style=\"background-color: #ffffff; border: 1px solid #dddddd; border-radius: 6px; padding: 22px; box-sizing: border-box;\">
                {img_tag}
                <div style=\"font-size: 10px; font-weight: 800; color: #111111; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px;\">{cat}</div>
                <a href=\"{url}\" style=\"text-decoration: none; color: #111111; font-size: 18px; font-weight: 800; line-height: 1.6; display: block; margin-bottom: 6px;\">{title}</a>
                <p style=\"font-size: 15px; color: #444444; line-height: 1.8; margin: 0 0 8px 0;\">{summary}</p>
                <div style=\"font-size: 13px; color: #777777;\">{source} &bull; {date}</div>
              </div>
              '''

          def render_section(title_kr, title_en, items, cat_key):
              if not items: return ''
              cat_sums = summaries.get(cat_key, [])
              sum_bullets = ''.join([f'<li style=\"margin-bottom: 8px; font-size: 15px; line-height: 1.8; color: #333333;\">{html_lib.escape(str(s))}</li>' for s in cat_sums])
              
              summary_html = f'''
              <div style=\"background-color: #f8f9fa; border-left: 3px solid #ea580c; padding: 18px 20px; margin-bottom: 16px;\">
                <ul style=\"margin: 0; padding-left: 16px;\">
                  {sum_bullets}
                </ul>
              </div>
              ''' if sum_bullets else ''

              section_html = f'''
              <div style=\"border-bottom: 2px solid #111111; padding-bottom: 4px; margin-top: 25px; margin-bottom: 10px;\">
                <table width=\"100%\">
                  <tr>
                    <td style=\"font-size: 21px; font-weight: 800; color: #111111;\">{title_kr}</td>
                    <td align=\"right\" style=\"font-size: 10px; font-weight: 700; color: #888888;\">{title_en}</td>
                  </tr>
                </table>
              </div>
              {summary_html}
              <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" style=\"margin-bottom: 15px;\">
                <tr>
              '''
              for idx, item in enumerate(items):
                  if idx:
                      section_html += '</tr><tr>'
                  section_html += f'<td width=\"100%\" valign=\"top\" style=\"padding: 0 0 12px;\">{render_card(item)}</td>'
              section_html += '</tr></table>'
              return section_html

          stock_price_str = stock.get('price', '$0.00')
          stock_change_str = stock.get('change', '')
          stock_color = '#2e7d32' if stock.get('is_up', True) else '#d32f2f'

          html = f'''
          <!DOCTYPE html>
          <html>
          <head><meta charset=\"utf-8\"></head>
          <body style=\"margin: 0; padding: 20px 10px; background-color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\">
            <div style=\"max-width: 720px; margin: 0 auto; background-color: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);\">
              <!-- Outlook-compatible header: explicit table cell backgrounds and dark text -->
              <table role=\"presentation\" width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" bgcolor=\"#ffffff\" style=\"background-color:#ffffff;border-bottom:3px solid #ea580c;\">
                <tr>
                  <td valign=\"top\" bgcolor=\"#ffffff\" style=\"background-color:#ffffff;padding:24px 12px 24px 25px;\">
                    <div style=\"font-size:12px;font-weight:800;letter-spacing:1px;color:#c2410c;margin-bottom:7px;\">WEEKLY INTELLIGENCE REPORT</div>
                    <div style=\"font-family:Arial,sans-serif;font-size:32px;line-height:1.2;font-weight:900;color:#111111;\"><strong style=\"color:#111111;\">NIKE WEEKLY</strong></div>
                  </td>
                  <td align=\"right\" valign=\"top\" bgcolor=\"#ffffff\" style=\"background-color:#ffffff;padding:24px 25px 24px 4px;\">
                    <table role=\"presentation\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\"><tr><td bgcolor=\"#111111\" style=\"background-color:#111111;padding:9px 12px;\"><a href=\"https://a01026710821-gif.github.io/Nike-Daily/\" style=\"font-family:Arial,sans-serif;font-size:13px;font-weight:800;color:#ffffff;text-decoration:none;\"><strong style=\"color:#ffffff;\">웹페이지 보기 &rarr;</strong></a></td></tr></table>
                    <div style=\"font-size:12px;font-weight:700;color:#111111;margin-top:10px;\">NKE {stock_price_str} <span style=\"color:{stock_color};\">{stock_change_str}</span></div>
                    <div style=\"font-size:12px;color:#555555;margin-top:4px;\">{today_str}</div>
                  </td>
                </tr>
              </table>

              <div style=\"padding: 14px 22px 26px 22px;\">
                {ai_notice}
          {brief_html}
                <div style=\"padding:16px 0 6px;border-bottom:3px solid #111111;font-size:23px;font-weight:900;color:#111111;\">WEEKLY NEWS DIGEST</div>
          {render_section('제품 · 컬렉션', 'PRODUCT', product_items, 'PRODUCT')}
                {render_section('브랜드 · 마케팅', 'BRAND', brand_items, 'BRAND')}
                {render_section('스포츠 · 선수', 'SPORTS', sports_items, 'SPORTS')}
                {render_section('증시 · 기업경영', 'MARKET', market_items, 'MARKET')}
                {render_section('경쟁사 동향', 'COMPETITOR', competitor_items, 'COMPETITOR')}
              </div>

              <div style=\"background-color: #f9f9fb; border-top: 1px solid #eeeeee; padding: 15px 20px; text-align: center; font-size: 11px; color: #777777;\">
                <p style=\"margin: 0 0 6px 0; font-weight: 600;\">본 메일은 NIKE WEEKLY 주간 뉴스레터 구독자에게 발송됩니다.</p>
                <p style=\"margin: 0;\">
                  <a href=\"https://a01026710821-gif.github.io/Nike-Daily/\" style=\"color: #111111; font-weight: bold; text-decoration: underline;\">웹사이트에서 보기</a>
                </p>
              </div>

            </div>
          </body>
          </html>
          '''

          try:
              server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
              server.login(gmail_user, gmail_pass)
              for sub in subscribers:
                  try:
                      msg = MIMEMultipart('alternative')
                      msg['Subject'] = f\"[NIKE WEEKLY] 주간 나이키 뉴스 리포트 ({today_str})\"
                      msg['From'] = gmail_user
                      msg['To'] = sub
                      msg.attach(MIMEText(html, 'html'))
                      server.sendmail(gmail_user, sub, msg.as_string())
                      print('발송 완료:', sub)
                  except Exception as sub_err:
                      print(f'개별 발송 실패 ({sub}):', sub_err)
              server.quit()
          except Exception as e:
              print('메일 서버 접속 오류:', e)
          "
