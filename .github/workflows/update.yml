name: Update Nike Daily News & Send Email

on:
  schedule:
    # 매일 한국 시간 기준 오전 7시 실행 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 실행 지원

jobs:
  update-and-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 lxml requests

      - name: Fetch Latest News
        run: |
          python scripts/fetch_news.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/news.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto update news data" &&
            git pull --rebase origin main &&
            git push
          )

      - name: Send Email Newsletter
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUBSCRIBERS_SHEET_URL: ${{ secrets.SUBSCRIBERS_SHEET_URL }}
        run: |
          python -c "
          import os, json, smtplib, csv, urllib.request, datetime
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          sheet_url = os.environ.get('SUBSCRIBERS_SHEET_URL')
          gmail_user = os.environ.get('GMAIL_USER')
          gmail_pass = os.environ.get('GMAIL_APP_PASSWORD')

          if not sheet_url or not gmail_user or not gmail_pass:
              print('이메일 설정 정보가 부족하여 스킵합니다.')
              exit(0)

          # 1. 구독자 목록 가져오기
          subscribers = []
          try:
              req = urllib.request.urlopen(sheet_url)
              lines = [l.decode('utf-8') for l in req.readlines()]
              reader = csv.reader(lines)
              next(reader, None)
              for row in reader:
                  for col in row:
                      if '@' in col:
                          subscribers.append(col.strip())
          except Exception as e:
              print('구독자 목록 불러오기 실패:', e)

          subscribers = list(set(subscribers))
          if not subscribers:
              print('구독자가 없습니다.')
              exit(0)

          # 2. 뉴스 데이터 읽기
          with open('data/news.json', 'r', encoding='utf-8') as f:
              news_data = json.load(f)

          articles = news_data.get('items', [])
          if not articles:
              print('발송할 뉴스가 없습니다.')
              exit(0)

          today_str = datetime.date.today().strftime('%Y년 %m월 %d일')

          # 카테고리별 기사 분류
          top_story = articles[0] if len(articles) > 0 else None
          sub_top_1 = articles[1] if len(articles) > 1 else None
          sub_top_2 = articles[2] if len(articles) > 2 else None

          product_brand_items = [a for a in articles[3:] if a.get('cat') in ['PRODUCT', 'BRAND']][:3]
          business_market_items = [a for a in articles[3:] if a.get('cat') in ['BUSINESS', 'MARKET', 'SPORTS']][:3]

          # 만약 카테고리 기사가 모자라면 나머지로 채움
          remains = [a for a in articles[3:] if a not in product_brand_items and a not in business_market_items]
          while len(product_brand_items) < 3 and remains:
              product_brand_items.append(remains.pop(0))
          while len(business_market_items) < 3 and remains:
              business_market_items.append(remains.pop(0))

          def render_card(item, is_large=False):
              if not item: return ''
              cat = item.get('cat', 'BUSINESS')
              title = item.get('title', '')
              summary = item.get('summary', '')[:120] + '...' if len(item.get('summary', '')) > 120 else item.get('summary', '')
              source = item.get('source', '')
              date = item.get('date', '')
              url = item.get('url', '#')

              title_size = '20px' if is_large else '15px'
              padding = '24px' if is_large else '18px'

              return f'''
              <div style=\"background-color: #ffffff; border: 1px solid #e5e5e5; border-radius: 6px; padding: {padding}; height: 100%; box-sizing: border-box;\">
                <div style=\"font-size: 11px; font-weight: 700; color: #666666; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px;\">{cat}</div>
                <a href=\"{url}\" style=\"text-decoration: none; color: #111111; font-size: {title_size}; font-weight: 800; line-height: 1.35; display: block; margin-bottom: 10px;\">{title}</a>
                <p style=\"font-size: 13px; color: #555555; line-height: 1.5; margin: 0 0 12px 0;\">{summary}</p>
                <div style=\"font-size: 11px; color: #888888;\">{source} &bull; {date}</div>
              </div>
              '''

          # 3. 웹페이지 형태의 이메일 HTML 생성
          html = f'''
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset=\"utf-8\">
          </head>
          <body style=\"margin: 0; padding: 30px 10px; background-color: #f6f6f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;\">
            <div style=\"max-width: 680px; margin: 0 auto;\">
              
              <!-- 상단 헤더 -->
              <div style=\"margin-bottom: 25px;\">
                <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #777777; text-transform: uppercase; margin-bottom: 4px;\">NIKE INDUSTRY & MARKET INTELLIGENCE</div>
                <h1 style=\"margin: 0 0 6px 0; font-size: 32px; font-weight: 900; letter-spacing: -1px; color: #111111;\">오늘의 나이키</h1>
                <div style=\"font-size: 14px; color: #666666;\">나이키와 스포츠·패션 시장의 핵심 소식을 한눈에. ({today_str})</div>
              </div>

              <!-- 상단 피처드 섹션 (메인 1개 + 우측 2개) -->
              <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" style=\"margin-bottom: 30px;\">
                <tr>
                  <td width=\"58%\" valign=\"top\" style=\"padding-right: 10px;\">
                    {render_card(top_story, is_large=True)}
                  </td>
                  <td width=\"42%\" valign=\"top\" style=\"padding-left: 10px;\">
                    <div style=\"margin-bottom: 12px;\">{render_card(sub_top_1)}</div>
                    <div>{render_card(sub_top_2)}</div>
                  </td>
                </tr>
              </table>

              <!-- 섹션 1: 제품 · 브랜드 -->
              <div style=\"border-bottom: 2px solid #111111; padding-bottom: 6px; margin-bottom: 15px;\">
                <table width=\"100%\">
                  <tr>
                    <td style=\"font-size: 16px; font-weight: 800; color: #111111;\">제품 · 브랜드</td>
                    <td align=\"right\" style=\"font-size: 11px; font-weight: 700; color: #888888; text-transform: uppercase;\">PRODUCT / BRAND</td>
                  </tr>
                </table>
              </div>
              <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" style=\"margin-bottom: 30px;\">
                <tr>
          '''

          for item in product_brand_items:
              html += f'<td width=\"33%\" valign=\"top\" style=\"padding: 0 5px;\">{render_card(item)}</td>'

          html += f'''
                </tr>
              </table>

              <!-- 섹션 2: 기업 · 경영 -->
              <div style=\"border-bottom: 2px solid #111111; padding-bottom: 6px; margin-bottom: 15px;\">
                <table width=\"100%\">
                  <tr>
                    <td style=\"font-size: 16px; font-weight: 800; color: #111111;\">기업 · 경영</td>
                    <td align=\"right\" style=\"font-size: 11px; font-weight: 700; color: #888888; text-transform: uppercase;\">CORPORATE / BUSINESS</td>
                  </tr>
                </table>
              </div>
              <table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\" style=\"margin-bottom: 30px;\">
                <tr>
          '''

          for item in business_market_items:
              html += f'<td width=\"33%\" valign=\"top\" style=\"padding: 0 5px;\">{render_card(item)}</td>'

          html += f'''
                </tr>
              </table>

              <!-- 하단 푸터 -->
              <div style=\"border-top: 1px solid #e5e5e5; padding-top: 20px; text-align: center; font-size: 12px; color: #888888;\">
                <p style=\"margin: 0 0 8px 0;\">본 메일은 <b>NIKE DAILY</b> 자동 뉴스레터 구독자에게 발송됩니다.</p>
                <a href=\"https://a01026710821-gif.github.io/Nike-Daily/\" style=\"color: #111111; font-weight: bold; text-decoration: underline;\">웹사이트 전체보기 &rarr;</a>
              </div>

            </div>
          </body>
          </html>
          '''

          # 4. 메일 전송
          try:
              server = smtplib.SMTP_SSL('smtp.gmail.com', 465)
              server.login(gmail_user, gmail_pass)
              for sub in subscribers:
                  msg = MIMEMultipart('alternative')
                  msg['Subject'] = f\"[NIKE DAILY] 오늘의 나이키 뉴스 브리핑 ({today_str})\"
                  msg['From'] = gmail_user
                  msg['To'] = sub
                  msg.attach(MIMEText(html, 'html'))
                  server.sendmail(gmail_user, sub, msg.as_string())
                  print('발송 완료:', sub)
              server.quit()
          except Exception as e:
              print('메일 발송 오류:', e)
          "
